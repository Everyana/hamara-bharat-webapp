name: Keep every published story in the archive

on:
  push:
    branches: [main]
    paths:
      - 'data/stories.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge live stories into data/archive.json
        run: |
          node -e '
            const fs=require("fs");
            const live=JSON.parse(fs.readFileSync("data/stories.json","utf8"));
            const arch=fs.existsSync("data/archive.json")?JSON.parse(fs.readFileSync("data/archive.json","utf8")):[];
            const m=new Map(arch.map(s=>[s.id,s]));
            for(const s of live) m.set(s.id,{...m.get(s.id),...s});
            const out=[...m.values()].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
            fs.writeFileSync("data/archive.json",JSON.stringify(out,null,2)+"\n");'
      - name: Commit the archive if it changed
        run: |
          git config user.name "swipes-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive published stories"
            git push
          fi
